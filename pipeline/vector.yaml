#If restarting the pipeline, make sure to delete the .vector-data directory to avoid any issues with the state of the pipeline
#Add a data_dir configuration at the top level of your vector.yaml file to tell Vector to store its state locally
data_dir: "./data/vector_state"            

#Reading the file
sources:
  #name
  tail_mock_logs:
    type: file #read a file type
    include:
      - "data/mock_app.log" #point to the log file generated by generator.py
    read_from: end  #read from end to get only the new logs

#Sending over http
sinks:
  send_to_fastapi:
    type: http
    inputs: 
      - tail_mock_logs
    uri: "http://127.0.0.1:8000/api/logs"
    method: post
    encoding: 
      codec: json
    #Batching to reduce the no of http request
    batch:
      max_event: 6
      timeout_secs: 1