data_dir: "/var/lib/vector"

sources:
  tail_mock_logs:
    type: file
    include:
      - "data/mock_app.log"
    read_from: end

sinks:
  send_to_fastapi:
    type: http
    inputs: 
      - tail_mock_logs
  
    uri: "${BACKEND_API_URL:-http://localhost:8000}/api/logs"
    method: post
    encoding: 
      codec: json
    batch:
      max_events: 10
      timeout_secs: 3
    #Robustness configuration
    request:
      retry_attempts: 5
      timeout_secs: 5
    # Prevents crashing if the backend isn't ready immediately
    healthcheck:
      enabled: true