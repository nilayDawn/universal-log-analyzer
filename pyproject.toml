[project]
name = "universal-log-analyzer"
version = "0.0.1"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn",
    "pandas",
    "numpy",
    "sentence-transformers",
    "requests",
    "ipykernel",
    "scikit-learn",
    "streamlit>=1.58.0",
    "plotly>=6.7.0",
    "torchvision>=0.27.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
