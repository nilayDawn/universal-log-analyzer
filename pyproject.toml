[project]
name = "universal-log-analyzer"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pandas",
    "numpy",
    "requests",
    "ipykernel",
    "scikit-learn",
    "streamlit>=1.58.0",
    "plotly>=6.7.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers",
    "torch",
]



[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
